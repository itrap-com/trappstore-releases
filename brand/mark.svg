<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Trappstore">
  <title>Trappstore</title>
  <!--
    THE MARK — a through-slot. Sodium punches the plate and sticks out both sides.
    GRID        108. Safe 18–90.
    TRANSOM     metal 30,22 48×26, rx 4 top.
    SLOT        18,48 72×18 sodium — wider than the plate.
    SILL        metal 30,66 48×20, rx 4 bottom.
    MIN 16px    the through-bar still reads.
    PALETTE     night #0E0B09 · metal #2A241C · sodium #E8942A
  -->
  <rect width="108" height="108" fill="#0E0B09"/>
  <rect x="18" y="48" width="72" height="18" fill="#E8942A"/>
  <path fill="#2A241C" d="M30.0,48.0V26.0A4.0,4.0 0 0 1 34.0,22.0H74.0A4.0,4.0 0 0 1 78.0,26.0V48.0Z"/>
  <path fill="#2A241C" d="M30.0,66.0H78.0V82.0A4.0,4.0 0 0 1 74.0,86.0H34.0A4.0,4.0 0 0 1 30.0,82.0Z"/>
</svg>
